name: C02_fix_failing_test
capability: debugging
prompt: >
  当前仓库测试失败。请定位根因并最小修改修复，最后确保测试通过。
  只能修改 src/ 下的业务代码，不要修改 tests/ 或测试导入路径。
sandbox_mode: locked
workspace:
  writable_paths: ["src/"]
budget:
  max_bash_actions: 25
assertions:
  - type: command
    command: "python -m unittest discover -s tests"
    expect_exit_code: 0
  - type: diff_allowlist
    paths: ["src/"]
  - type: file_not_contains
    path: src/calculator.py
    patterns: ["TODO", "pass  #"]
proves: "Agent 能读失败信息、定位代码并做最小修复。"
