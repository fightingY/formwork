name: C04_add_regression_test
capability: test_writing
prompt: >
  这里有一个已经修复过的边界情况：空输入应该返回空列表。
  请在现有 `ParserTests` unittest 类内补充一个空输入返回空列表的测试方法，不改变业务代码。
  使用 `python -m unittest discover -s tests` 验证一次，通过后立即返回 final，不要重复检查。
sandbox_mode: locked
budget:
  max_turns: 10
  max_bash_actions: 20
assertions:
  - type: command
    command: "python -m unittest discover -s tests"
    expect_exit_code: 0
  - type: diff_allowlist
    paths: ["tests/"]
  - type: file_contains
    path: tests/test_parser.py
    patterns: ["empty", "[]"]
proves: "Agent 能只补测试，不乱改业务代码。"
