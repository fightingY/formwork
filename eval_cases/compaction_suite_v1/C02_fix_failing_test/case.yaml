name: V21_C02_fix_failing_test
capability: debugging
fixture: ../../capability_suite_v1/C02_fix_failing_test/fixture
prompt: >
  当前仓库测试失败。请定位根因并最小修改修复，最后确保测试通过。
  只能修改 src/ 下的业务代码，不要修改 tests/ 或测试导入路径。
sandbox_mode: locked
workspace:
  writable_paths: ["src/"]
budget:
  max_bash_actions: 25
context:
  max_prompt_chars: 1
  recent_turns: 1
  summary_max_chars: 3000
  retention_markers: ["src/calculator.py", "return a - b", "python -m unittest discover -s tests"]
assertions:
  - type: command
    command: "python -m unittest discover -s tests"
    expect_exit_code: 0
  - type: diff_allowlist
    paths: ["src/"]
  - type: file_not_contains
    path: src/calculator.py
    patterns: ["TODO", "pass  #"]
proves: "V2.1 在调试任务中保留关键文件、根因指纹和 patch 验证状态。"
