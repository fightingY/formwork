[project]
name = "mini-claude-code"
version = "3.2.0"
description = "A Bash-first CodeAct agent harness for interview-ready Agent engineering demos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
minicc = "minicc.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2",
    "pytest>=8.0.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "types-pyyaml>=6.0.12.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minicc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["minicc"]

[tool.coverage.report]
fail_under = 78
precision = 2
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
