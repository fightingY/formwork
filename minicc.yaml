provider:
  # Root/main agent model. Can also be set with MINICC_MODEL.
  base_url: https://api.siliconflow.cn/v1
  model: deepseek-ai/DeepSeek-V4-Pro
  json_mode: true
  timeout_sec: 300
  max_retries: 2

child_provider:
  # Child/scout/planner/reviewer model. Can also be set with MINICC_CHILD_MODEL.
  # MINICC_FAST_MODEL is accepted as a backwards-compatible alias.
  base_url: https://api.siliconflow.cn/v1
  model: deepseek-ai/DeepSeek-V4-Flash
  temperature: 0
  json_mode: true

project:
  milestone: v3.6

workspace:
  ignored_allowlist: []

tooling:
  profile: baseline-bash
  max_parallel_tool_calls: 4
  max_tool_calls_per_step: 16

sandbox:
  image: python@sha256:a3ab0b966bc4e91546a033e22093cb840908979487a9fc0e6e38295747e49ac0
  mode: locked
  cpus: "1"
  memory: 1g
  pids_limit: 256
  network: none

budget:
  max_bash_actions: 30
  max_seconds: 900
  max_action_timeout_sec: 120

context:
  max_prompt_chars: 120000
  recent_turns: 6
  artifact_preview_chars: 12000
  summary_max_chars: 12000
  field_preview_chars: 4000
  compaction_strategy: deterministic
  semantic_max_input_chars: 60000
  # Keep the full append-only history until the prompt budget triggers one compaction.
  prompt_layout: append_until_compaction

policy:
  require_approval_for_network: true
  deny_sudo: true
  require_approval_for_destructive: true
